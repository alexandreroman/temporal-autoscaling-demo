apiVersion: temporal.io/v1alpha1
kind: TemporalWorkerDeployment
metadata:
  name: worker
spec:
  workerOptions:
    connectionRef:
      name: temporal-connection
    temporalNamespace: default
  rollout:
    strategy: AllAtOnce
  sunset:
    # Aggressive timings for demo visibility;
    # production would use hours, not seconds.
    scaledownDelay: 30s
    deleteDelay: 60s
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-autoscaling-demo
        app.kubernetes.io/component: worker
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: temporal-autoscaling-demo
            app.kubernetes.io/component: worker
      # Activities complete in under 3 seconds;
      # 20 seconds is plenty for graceful shutdown.
      terminationGracePeriodSeconds: 20
      containers:
      - name: worker
        image: ghcr.io/alexandreroman/temporal-autoscaling-demo-worker
        ports:
        - containerPort: 9081
          name: management
        lifecycle:
          preStop:
            sleep:
              # Brief pause for endpoint de-registration
              # before SIGTERM.
              seconds: 3
        envFrom:
        - secretRef:
            name: otel
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: management
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
          initialDelaySeconds: 15
          periodSeconds: 10
