# HPA attached to each versioned Deployment.
# Scales on worker slot usage via prometheus-adapter.
# scaleTargetRef auto-injected by the controller.
apiVersion: temporal.io/v1alpha1
kind: WorkerResourceTemplate
metadata:
  name: worker-hpa
spec:
  temporalWorkerDeploymentRef:
    name: worker
  template:
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    spec:
      scaleTargetRef: {}
      minReplicas: 1
      maxReplicas: 5
      metrics:
        - type: External
          external:
            metric:
              name: temporal_worker_slots_used_by_version
            target:
              # Low threshold for demo: triggers
              # scale-up quickly under light load.
              type: AverageValue
              averageValue: "50"
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 10
        scaleDown:
          # Short window for demo visibility;
          # production would use 5 minutes.
          stabilizationWindowSeconds: 30
          policies:
            # Remove 1 pod every 15 seconds.
            - type: Pods
              value: 1
              periodSeconds: 15
