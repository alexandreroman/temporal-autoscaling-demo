spring:
  application:
    name: autoscaling-demo-worker
  main:
    web-application-type: servlet

  temporal:
    namespace: ${TEMPORAL_NAMESPACE:default}
    connection:
      target: ${TEMPORAL_ADDRESS:localhost:7233}
    workers-auto-discovery:
      packages:
      - io.temporal.demos
  lifecycle:
    # Activities complete in under 3 seconds;
    # 10 seconds is enough to drain in-flight work.
    timeout-per-shutdown-phase: 10s

server:
  port: 0

logging:
  structured:
    format:
      console: ecs

management:
  server:
    port: 9081
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        histogram-flavor: explicit_bucket_histogram
        step: 10s
  opentelemetry:
    resource-attributes: &otel-tags
      service.name: ${spring.application.name}
      service.namespace: temporal-autoscaling-demo
      service.instance.id: ${random.uuid}
  tracing:
    export:
      enabled: false
  metrics:
    tags:
      <<: *otel-tags
    distribution:
      percentiles-histogram:
        order.duration: true
        order.activity.duration: true

---
# Enable Worker Versioning when running on Kubernetes.
# The Worker Controller injects TEMPORAL_DEPLOYMENT_NAME
# and TEMPORAL_WORKER_BUILD_ID into the pod environment.
spring:
  config:
    activate:
      on-cloud-platform: kubernetes
  temporal:
    workers:
      - task-queue: order-processing
        deployment-properties:
          use-versioning: true
          deployment-name: ${TEMPORAL_DEPLOYMENT_NAME}
          build-id: ${TEMPORAL_WORKER_BUILD_ID}
          default-versioning-behavior: auto-upgrade

# Tag every metric with versioning coordinates so
# Prometheus queries can split by deployment and build.
management:
  metrics:
    tags:
      temporal.worker.deployment.name: >-
        ${TEMPORAL_DEPLOYMENT_NAME}
      temporal.worker.build.id: >-
        ${TEMPORAL_WORKER_BUILD_ID}
      temporal.namespace: >-
        ${TEMPORAL_NAMESPACE:default}
