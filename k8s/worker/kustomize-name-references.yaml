# Kustomize name-reference configuration for the
# TemporalWorkerDeployment CRD.
#
# Kustomize automatically substitutes generated Secret
# names (with hash suffixes from secretGenerator) in
# standard resources like Deployments. However, it does
# not know about the pod template path inside CRDs.
#
# This configuration teaches kustomize that the
# TemporalWorkerDeployment CRD contains Secret
# references at the same pod template paths as a
# standard Deployment, so the hash-suffixed names
# are propagated correctly.
nameReference:
  - kind: Secret
    fieldSpecs:
      - path: spec/template/spec/containers/envFrom/secretRef/name
        kind: TemporalWorkerDeployment
      - path: spec/template/spec/initContainers/envFrom/secretRef/name
        kind: TemporalWorkerDeployment
      - path: spec/template/spec/containers/env/valueFrom/secretKeyRef/name
        kind: TemporalWorkerDeployment
